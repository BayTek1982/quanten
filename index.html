<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quanten-Schule</title>
<meta name="description" content="Quantenphysik Schritt für Schritt: kurze Erklärbilder, die sich selbst aufbauen.">
<meta name="theme-color" content="#04070E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Kompass Dark: Terminal-Look, große Bento-Kacheln, Mono-Überschriften, eine Akzentfarbe pro Bereich */
:root{
  --bg:#F3F5F9; --flaeche:#FFFFFF; --flaeche2:#E9EDF4; --linie:#D5DBE6;
  --text:#0D1320; --grau:#566074;
  --blau:#1C6BD0; --gruen:#0B8F59; --gold:#9A6A00; --rot:#CC3838; --violett:#6646CF;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Inter",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#04070E; --flaeche:#0B111C; --flaeche2:#121A28; --linie:#1D2636;
    --text:#ECF0F6; --grau:#8A93A6;
    --blau:#4DA3FF; --gruen:#26D68C; --gold:#F5C442; --rot:#F05A5A; --violett:#A98BFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04070E; --flaeche:#0B111C; --flaeche2:#121A28; --linie:#1D2636;
  --text:#ECF0F6; --grau:#8A93A6;
  --blau:#4DA3FF; --gruen:#26D68C; --gold:#F5C442; --rot:#F05A5A; --violett:#A98BFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--blau);outline-offset:2px}
h1,h2,h3{font-family:var(--mono);text-wrap:balance;margin:0;line-height:1.2}
h1,h2,.karte b,.weiter a,.seite a{overflow-wrap:anywhere;hyphens:auto}
.weiter a{min-width:0}
p{margin:0}
.mono{font-family:var(--mono)}
.klein{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--grau)}

.rahmen{max-width:1180px;margin:0 auto;padding:0 16px 48px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.marke{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.marke b{font-family:var(--mono);font-size:18px}
.thema{display:flex;border:1px solid var(--linie);border-radius:10px;overflow:hidden;background:var(--flaeche)}
.thema button{border:0;background:none;padding:8px 10px;font-size:13px;font-family:var(--mono);color:var(--grau)}
.thema button[aria-pressed="true"]{background:var(--flaeche2);color:var(--text)}

.gitter{display:block}
.seite{display:none}
@media (min-width:960px){
  .gitter{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
  .seite{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--linie);border-radius:14px;background:var(--flaeche);padding:14px}
}
.seite input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--linie);background:var(--bg);color:var(--text);font:inherit;font-size:14px}
.seite h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--akz);margin-top:6px}
.seite a{display:block;padding:5px 6px;border-radius:6px;font-size:14px;color:var(--text);text-decoration:none}
.seite a:hover{background:var(--flaeche2)}
.seite a.aus{color:var(--grau);pointer-events:none}
.seite a.hier{background:var(--flaeche2)}

.zurueck{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linie);background:var(--flaeche);border-radius:10px;padding:8px 12px;font-family:var(--mono);font-size:13px;text-decoration:none;color:var(--text);margin-bottom:14px}
.titelblock{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.titelblock h1{font-size:clamp(20px,6.1vw,26px)}
.titelblock p{color:var(--grau);max-width:60ch}

.bento{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:620px){.bento{grid-template-columns:1fr 1fr}.bento .breit{grid-column:span 2}}
.kachel{display:flex;flex-direction:column;gap:10px;text-align:left;text-decoration:none;color:var(--text);background:var(--flaeche);border:1px solid var(--linie);border-top:3px solid var(--akz);border-radius:16px;padding:18px;min-height:170px}
.kachel:hover{background:var(--flaeche2)}
.kachel svg{width:44px;height:44px;color:var(--akz)}
.kachel h2{font-size:19px}
.kachel p{color:var(--grau);font-size:15px;flex:1}
.balken{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--grau);font-variant-numeric:tabular-nums}
.balken i{flex:1;height:6px;border-radius:3px;background:var(--flaeche2);overflow:hidden;display:block}
.balken i b{display:block;height:100%;background:var(--akz)}
.kachel.aus{opacity:.65;pointer-events:none}

.karten{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.karten{grid-template-columns:1fr 1fr}}
.karte{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);background:var(--flaeche);border:1px solid var(--linie);border-left:3px solid var(--akz);border-radius:12px;padding:14px}
.karte:hover{background:var(--flaeche2)}
.karte .klein{display:flex;justify-content:space-between;gap:8px}
.karte b{font-family:var(--mono);font-size:16px}
.karte.aus{border-left-color:var(--linie);color:var(--grau);pointer-events:none}
.haken{color:var(--gruen)}

.buehne{background:var(--flaeche);border:1px solid var(--linie);border-radius:16px 16px 0 0;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:360/280}
.steuer{background:var(--flaeche);border:1px solid var(--linie);border-top:0;border-radius:0 0 16px 16px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.reihe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rund{width:42px;height:42px;border-radius:50%;border:1px solid var(--linie);background:var(--flaeche2);display:grid;place-items:center;flex:none}
.rund.haupt{background:var(--akz);border-color:var(--akz);color:var(--bg)}
.rund svg{width:18px;height:18px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--akz);height:28px}
.chip{min-width:40px;height:36px;padding:0 10px;border-radius:9px;border:1px solid var(--linie);background:var(--flaeche2);font-family:var(--mono);font-size:14px}
.chip[aria-pressed="true"]{background:var(--akz);border-color:var(--akz);color:var(--bg);font-weight:700}
.tempo{display:flex;align-items:center;gap:8px;margin-left:auto}
.erkl{margin-top:14px;background:var(--flaeche);border:1px solid var(--linie);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.erkl .klein{color:var(--akz)}
.erkl h2{font-size:18px}
.erkl p{max-width:65ch}
.merk{margin-top:12px;border:1px dashed var(--akz);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.merk p{font-family:var(--mono);font-weight:700}
.boxen{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media (min-width:620px){.boxen{grid-template-columns:1fr 1fr}}
.box{background:var(--flaeche);border:1px solid var(--linie);border-left:3px solid var(--f);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.box .klein{color:var(--f)}
.box p{font-size:15px}
.weiter{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.weiter a{flex:1;border:1px solid var(--linie);background:var(--flaeche);border-radius:12px;padding:12px;text-decoration:none;color:var(--text);font-family:var(--mono);font-size:14px;display:flex;flex-direction:column;gap:2px}
.weiter a:last-child{text-align:right}
.weiter a.aus{color:var(--grau);pointer-events:none}
</style>
</head>

</div>

function schreib(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

 {nr:4,b:1,titel:"Das Photon und E = h · f",zeichne:"photon",

  schritte:[
   {titel:"Wellen überlagern sich",dauer:7,text:"Treffen zwei Wellen aufeinander, addieren sie sich. Trifft Berg auf Berg, wird die Welle doppelt so hoch: Sie verstärken sich. Trifft Berg auf Tal, heben sie sich auf: Sie löschen sich aus."},
   {titel:"Licht auf zwei Spalte",dauer:7,text:"Um 1801 schickte der Engländer Thomas Young Licht auf eine Wand mit zwei schmalen Spalten. Dahinter stand ein Schirm. Damals stritt man, ob Licht aus Teilchen oder aus Wellen besteht."},
   {titel:"Aus einer Welle werden zwei",dauer:7,text:"Hinter jedem Spalt breitet sich das Licht wieder nach allen Seiten aus. Aus einer Welle werden so zwei, und sie schwingen im gleichen Takt. Auf dem Weg zum Schirm überlagern sie sich."},
   {titel:"Helle und dunkle Streifen",dauer:8,text:"Auf dem Schirm entstehen viele helle und dunkle Streifen. Hell ist es dort, wo sich die beiden Wellen verstärken. Dunkel ist es dort, wo sie sich auslöschen. Für Young war damit klar: Licht ist eine Welle."}
  ],
  merksatz:"Zwei Wellen im Takt verstärken sich, im Gegentakt löschen sie sich aus.",
  boxen:{
   was:"Interferenz ist die Überlagerung von Wellen. Beim Doppelspalt mit Licht zeigt sie sich als Muster aus hellen und dunklen Streifen.",
   so:"Licht einer Farbe auf zwei eng benachbarte Spalte schicken und den Schirm dahinter ansehen. Mehr als zwei Streifen bedeuten: Hier überlagern sich Wellen.",
   bedeutet:"Kugeln könnten sich nicht gegenseitig auslöschen. Das Streifenmuster galt deshalb rund 100 Jahre lang als Beweis, dass Licht eine Welle ist. Bereich 1 zeigt, warum das nur die halbe Wahrheit ist.",
   tipp:"Je größer die Wellenlänge, desto weiter liegen die Streifen auseinander. Rotes Licht macht breitere Streifen als blaues."
  }},
 {nr:7,b:2,titel:"Materiewellen (de Broglie)",zeichne:"debroglie",
  bild:"De Broglies Idee: Auch Teilchen haben eine Wellenlänge. Die Formel, der Vergleich langsam und schnell, Elektron und Fußball, zuletzt Beugungsringe hinter einem Kristall.",
  schritte:[
   {titel:"Eine kühne Idee",dauer:7,text:"Licht ist eine Welle und zeigt trotzdem Eigenschaften von Teilchen. 1924 drehte der Franzose Louis de Broglie den Gedanken um: Dann könnten auch Teilchen wie das Elektron Eigenschaften einer Welle haben."},
   {titel:"Die Formel",dauer:8,text:"De Broglie gab gleich eine Formel an. Die Wellenlänge ist Plancks Konstante h, geteilt durch Masse mal Geschwindigkeit. Das Zeichen für die Wellenlänge ist der griechische Buchstabe Lambda."},
   {titel:"Schneller heißt kürzer",dauer:7,text:"Je schneller ein Teilchen ist, desto kürzer ist seine Welle. Im Bild ist das untere Elektron dreimal so schnell wie das obere. Seine Wellenlänge ist deshalb nur ein Drittel so groß."},
   {titel:"Elektron und Fußball",dauer:8,text:"Ein Elektron mit 3.000 Kilometern pro Sekunde hat eine Wellenlänge von 0,24 Nanometern. Das ist etwa so groß wie ein Atom und lässt sich messen. Ein geschossener Fußball ist so schwer, dass seine Wellenlänge unmessbar klein ist. Darum merken wir im Alltag nichts davon."},
   {titel:"Der Beweis",dauer:8,text:"1927 schossen Forscher in den USA und in Großbritannien Elektronen auf Kristalle und dünne Metallfolien. Es entstanden Muster, wie sie nur Wellen erzeugen. Die gemessene Wellenlänge passte zur Formel. 1929 bekam de Broglie den Nobelpreis."}
  ],
  merksatz:"Jedes Teilchen hat eine Wellenlänge: λ = h / (m · v).",
  boxen:{
   was:"Eine Materiewelle ist die Welle, die zu einem Teilchen gehört. Ihre Wellenlänge hängt von Masse und Geschwindigkeit ab.",
   so:"Plancks Konstante h durch Masse mal Geschwindigkeit teilen. Je schwerer und je schneller das Teilchen, desto kürzer die Welle.",
   bedeutet:"Bei Elektronen ist die Wellenlänge etwa so groß wie ein Atom, deshalb zeigen sie Welleneigenschaften. Bei Alltagsdingen ist sie unvorstellbar klein und spielt keine Rolle.",
   tipp:"Rechenaufgabe: Ein Elektron mit 3.000 Kilometern pro Sekunde hat eine Wellenlänge von etwa 0,24 Nanometern. Bei doppelter Geschwindigkeit ist sie halb so groß: 0,12 Nanometer."
  }},
 {nr:8,b:2,titel:"Der Doppelspalt mit einzelnen Elektronen",zeichne:"doppelspalt",
  bild:"Eine Quelle schießt einzelne Elektronen auf eine Wand mit zwei Spalten. Auf dem Schirm dahinter entsteht Punkt für Punkt ein Streifenmuster.",
  schritte:[
   {titel:"Der Versuch",dauer:6,text:"Links steht eine Quelle, die Elektronen abschießt. In der Mitte ist eine Wand mit zwei schmalen Spalten. Rechts fängt ein Schirm die Elektronen auf. Jedes Elektron hinterlässt dort genau einen Punkt."},
   {titel:"Was man erwartet",dauer:7,text:"Wären Elektronen kleine Kugeln, würde jedes durch einen der beiden Spalte fliegen. Auf dem Schirm müssten dann zwei Streifen entstehen, einer hinter jedem Spalt."},
   {titel:"Ein Elektron nach dem anderen",dauer:8,text:"Jetzt wird immer nur ein einziges Elektron abgeschossen. Erst wenn es angekommen ist, folgt das nächste. Die Punkte auf dem Schirm scheinen zufällig verteilt zu sein. Niemand kann vorhersagen, wo das nächste Elektron landet."},
   {titel:"Das Streifenmuster",dauer:8,text:"Mit immer mehr Elektronen zeigt sich ein Muster: Streifen mit vielen Treffern wechseln sich mit fast leeren Streifen ab. Es sind nicht zwei Streifen, sondern viele. So ein Muster heißt Interferenz. Man kennt es sonst nur von Wellen."},
   {titel:"Die Welle geht durch beide Spalte",dauer:9,text:"Erklären lässt sich das nur so: Zu jedem Elektron gehört eine Welle, und sie geht durch beide Spalte zugleich. Dahinter überlagern sich die beiden Teile. Wo sie sich verstärken, landen viele Elektronen. Wo sie sich auslöschen, landet fast keines."}
  ],
  merksatz:"Ein Elektron landet als Punkt, verteilt sich aber wie eine Welle.",
  boxen:{
   was:"Der Doppelspalt-Versuch zeigt, dass Elektronen keine kleinen Kugeln sind. Einzeln abgeschossen bauen sie Punkt für Punkt ein Streifenmuster auf, wie es sonst nur Wellen erzeugen.",
   so:"Erstens Elektronen einzeln auf eine Wand mit zwei Spalten schießen. Zweitens jeden Treffer auf dem Schirm festhalten. Drittens warten: Aus scheinbar zufälligen Punkten werden Streifen.",
   bedeutet:"Wo ein einzelnes Elektron landet, lässt sich nicht vorhersagen. Vorhersagen lässt sich nur, wo viele landen und wo fast keine. Die Quantenphysik rechnet deshalb mit Wahrscheinlichkeiten.",
   tipp:"Den Versuch gibt es wirklich. Claus Jönsson zeigte das Streifenmuster 1961 in Tübingen. 1989 filmte ein Team um Akira Tonomura in Japan, wie es sich Punkt für Punkt aufbaut."
  }},
 {nr:9,b:2,titel:"Welle oder Teilchen?",zeichne:"dualismus",
  bild:"Am Doppelspalt breitet sich das Elektron wie eine Welle aus und kommt als Punkt an. Mit einem Messgerät an den Spalten bleiben nur zwei Streifen.",
  schritte:[
   {titel:"Unterwegs wie eine Welle",dauer:7,text:"Zwischen Quelle und Schirm verhält sich das Elektron wie eine Welle. Sie geht durch beide Spalte und überlagert sich dahinter. Nur so lässt sich das Streifenmuster erklären."},
   {titel:"Angekommen wie ein Teilchen",dauer:7,text:"Am Schirm ist von der Welle nichts zu sehen. Jedes Elektron kommt als Ganzes an einer einzigen Stelle an. Ein halbes Elektron oder einen verschmierten Fleck findet man nie."},
   {titel:"Nachsehen zerstört das Muster",dauer:9,text:"Stellt man an den Spalten ein Messgerät auf, das feststellt, durch welchen Spalt jedes Elektron geht, verschwindet das Streifenmuster. Übrig bleiben zwei Streifen, wie bei Kugeln. Das Wissen über den Weg zerstört die Interferenz."},
   {titel:"Weder noch",dauer:8,text:"Ein Elektron ist weder eine kleine Kugel noch eine Wasserwelle. Es ist ein Quantenobjekt. Je nach Versuch zeigt es Eigenschaften einer Welle oder eines Teilchens. Dasselbe gilt für Licht."}
  ],
  merksatz:"Ausbreiten wie eine Welle, ankommen wie ein Teilchen.",
  boxen:{
   was:"Welle-Teilchen-Dualismus heißt: Quantenobjekte wie Elektronen und Photonen zeigen je nach Versuch Eigenschaften von Wellen oder von Teilchen.",
   so:"Frage dich, was der Versuch zeigt. Geht es um die Ausbreitung, also das Streifenmuster, brauchst du das Wellenbild. Geht es um den Nachweis, also einzelne Treffer, brauchst du das Teilchenbild.",
   bedeutet:"Welle und Teilchen sind Bilder aus unserem Alltag. Für die Quantenwelt passt keines ganz. Erst beide zusammen beschreiben, was man misst.",
   tipp:"Sobald sich herausfinden lässt, durch welchen Spalt ein Elektron ging, ist das Streifenmuster weg. Dafür muss kein Mensch hinschauen, das Messgerät allein genügt."
  }},
 {nr:10,b:2,titel:"Die Wahrscheinlichkeitswelle",zeichne:"wahrscheinlich",
  bild:"Aus der Welle wird durch Quadrieren eine Kurve der Wahrscheinlichkeit. Viele zufällige Treffer füllen diese Kurve nach und nach auf.",
  schritte:[
   {titel:"Was schwingt da eigentlich?",dauer:7,text:"Bei einer Wasserwelle schwingt Wasser, beim Schall die Luft. Aber was schwingt bei der Welle eines Elektrons? 1926 gab Max Born die Antwort, die bis heute gilt: Die Welle beschreibt eine Wahrscheinlichkeit."},
   {titel:"Welle zum Quadrat",dauer:8,text:"Man nimmt die Höhe der Welle an einer Stelle mit sich selbst mal. Das Ergebnis sagt, wie wahrscheinlich man das Elektron dort findet. Weil Minus mal Minus Plus ergibt, kommt nie ein negativer Wert heraus."},
   {titel:"Oft und nie",dauer:7,text:"Wo die Kurve hoch ist, landen viele Elektronen. Wo sie null ist, landet keines. Das sind genau die vollen und die leeren Streifen beim Doppelspalt."},
   {titel:"Der einzelne Treffer ist Zufall",dauer:8,text:"Wo das nächste Elektron landet, weiß niemand. Erst viele Treffer zusammen füllen die Kurve auf. Die Quantenphysik sagt also nicht den einzelnen Treffer voraus, sondern die Verteilung."},
   {titel:"Wie beim Würfeln, nur grundsätzlicher",dauer:9,text:"Auch ein einzelner Würfelwurf lässt sich nicht vorhersagen, 1.000 Würfe aber schon: Jede Zahl kommt etwa gleich oft. Beim Würfel fehlen uns nur die genauen Einzelheiten des Wurfs. In der Quantenphysik ist der Zufall nach heutigem Wissen echt."}
  ],
  merksatz:"Die Welle sagt nicht, wo das Elektron ist, sondern wie oft man es wo findet.",
  boxen:{
   was:"Die Wahrscheinlichkeitswelle, auch Wellenfunktion genannt, beschreibt ein Quantenobjekt. Ihr Quadrat gibt an, mit welcher Wahrscheinlichkeit man es an einem Ort findet.",
   so:"Höhe der Welle an einer Stelle ablesen und mit sich selbst malnehmen. Großer Wert: Dort gibt es viele Treffer. Null: Dort gibt es keine.",
   bedeutet:"Für ein einzelnes Ereignis liefert die Quantenphysik nur eine Wahrscheinlichkeit. Für sehr viele Ereignisse stimmen ihre Vorhersagen dafür äußerst genau.",
   tipp:"Rechenaufgabe: Ist die Welle an Stelle A doppelt so hoch wie an Stelle B, landen bei A viermal so viele Elektronen, denn 2 · 2 = 4."
  }},
 {nr:11,b:3,titel:"Bohrs Atommodell",zeichne:"bohr",
  bild:"Ein Elektron, das in den Kern stürzen müsste. Dann Bohrs drei erlaubte Bahnen, ein Sprung von Bahn 3 auf Bahn 2 mit einem roten Photon und zuletzt eine Wolke statt der Bahnen.",
  schritte:[
   {titel:"Das Problem",dauer:7,text:"Um 1911 stellte man sich das Atom wie ein kleines Sonnensystem vor: Das Elektron kreist um den Kern. Nach den damaligen Gesetzen müsste ein kreisendes Elektron aber ständig Energie abstrahlen. Es würde in einem winzigen Bruchteil einer Sekunde in den Kern stürzen. Atome dürfte es gar nicht geben."},
   {titel:"Bohrs Regel",dauer:7,text:"1913 stellte der Däne Niels Bohr eine neue Regel auf. Für das Elektron sind nur ganz bestimmte Bahnen erlaubt. Auf diesen Bahnen strahlt es keine Energie ab. Dazwischen kann es sich nicht aufhalten."},
   {titel:"Jede Bahn hat ihre Energie",dauer:7,text:"Auf der innersten Bahn hat das Elektron die kleinste Energie. Das ist der Grundzustand. Je weiter außen die Bahn liegt, desto mehr Energie hat das Elektron."},
   {titel:"Der Quantensprung",dauer:8,text:"Das Elektron kann von einer Bahn auf eine andere springen. Springt es nach innen, gibt es Energie ab, und zwar als ein einzelnes Photon. Beim Sprung von Bahn 3 auf Bahn 2 entsteht im Wasserstoff rotes Licht."},
   {titel:"Was stimmt, was nicht",dauer:8,text:"Bohrs Modell erklärt, warum Atome stabil sind und nur bestimmte Farben aussenden. Die Energiestufen stimmen. Die Kreisbahnen stimmen nicht: Ein Elektron fliegt nicht wie ein Planet. Später wurden die Bahnen durch Wolken ersetzt, die Orbitale."}
  ],
  merksatz:"Im Atom hat das Elektron nur bestimmte Energien. Bei jedem Sprung entsteht oder verschwindet ein Photon.",
  boxen:{
   was:"Bohrs Atommodell von 1913 beschreibt das Wasserstoff-Atom mit festen Bahnen für das Elektron. Jede Bahn steht für eine bestimmte Energie.",
   so:"Erstens: Nur bestimmte Bahnen sind erlaubt. Zweitens: Auf einer Bahn strahlt das Elektron nicht. Drittens: Beim Sprung zwischen zwei Bahnen wird ein Photon abgegeben oder aufgenommen.",
   bedeutet:"Ein Quantensprung ist winzig, die kleinste Änderung, die es gibt. In der Alltagssprache meint man damit einen riesigen Fortschritt. Physikalisch ist es genau umgekehrt.",
   tipp:"Die Abstände im Bild sind nicht maßstäblich. In Wirklichkeit liegt Bahn 2 viermal und Bahn 3 neunmal so weit vom Kern entfernt wie Bahn 1."
  }},
 {nr:12,b:3,titel:"Energiestufen und Spektrallinien",zeichne:"stufen",
  bild:"Eine Leiter aus Energiestufen. Ein Elektron springt nach oben und fällt zurück, dabei entstehen Photonen in Rot, Türkis und Violett. Darunter die Linien im Spektrum von Wasserstoff und Natrium.",
  schritte:[
   {titel:"Die Energieleiter",dauer:7,text:"Die erlaubten Energien eines Atoms kann man wie eine Leiter zeichnen. Ganz unten ist Stufe 1, der Grundzustand. Nach oben rücken die Stufen immer enger zusammen. Zwischen den Stufen gibt es nichts."},
   {titel:"Anregen",dauer:7,text:"Bekommt das Atom Energie, zum Beispiel durch ein passendes Photon, durch Hitze oder durch Strom, springt das Elektron auf eine höhere Stufe. Das Atom ist dann angeregt. Dort bleibt das Elektron meist nur winzige Sekundenbruchteile."},
   {titel:"Zurückfallen",dauer:8,text:"Fällt das Elektron zurück, gibt es die Energie als Photon ab. Ein großer Sprung ergibt ein Photon mit viel Energie, ein kleiner eines mit wenig. Im Wasserstoff entstehen bei Sprüngen auf Stufe 2 rotes, türkises und violettes Licht."},
   {titel:"Der Fingerabdruck",dauer:8,text:"Zerlegt man das Licht von leuchtendem Wasserstoff in seine Farben, sieht man keinen Regenbogen, sondern einzelne Linien. Jede Linie gehört zu einem bestimmten Sprung. Jedes Element hat seine eigenen Stufen und damit seine eigenen Linien. Natrium leuchtet zum Beispiel gelb."},
   {titel:"Sterne lesen",dauer:8,text:"Auch im Licht der Sterne stecken diese Linien, dort als dunkle Lücken im Regenbogen. Die Atome in der Hülle des Sterns verschlucken genau ihre Farben. So erkennt man aus der Ferne, woraus ein Stern besteht. Helium wurde 1868 auf der Sonne entdeckt, lange bevor man es auf der Erde fand."}
  ],
  merksatz:"Jede Linie im Spektrum ist ein Sprung zwischen zwei Energiestufen.",
  boxen:{
   was:"Energiestufen sind die erlaubten Energien eines Elektrons im Atom. Spektrallinien sind die Farben, die bei Sprüngen zwischen diesen Stufen entstehen.",
   so:"Abstand zwischen zwei Stufen ansehen. Großer Abstand: Photon mit viel Energie, also eher violett oder UV. Kleiner Abstand: Photon mit wenig Energie, also eher rot oder infrarot.",
   bedeutet:"An den Linien erkennt man jedes Element eindeutig. Damit untersucht man Sterne, prüft Metalle und weist Stoffe in winzigen Mengen nach.",
   tipp:"Natrium kannst du selbst sehen: Streust du etwas Kochsalz in eine Gasflamme, leuchtet sie gelb. Das ist die Natrium-Linie bei 589 Nanometern."
  }},
 {nr:13,b:3,titel:"Orbitale statt Bahnen",zeichne:"orbital",
  bild:"Eine durchgestrichene Kreisbahn und daneben eine Punktwolke. Die Wolke baut sich aus einzelnen Messungen auf. Dann drei Formen: Kugel, Hantel und Kleeblatt. Zuletzt eine Welle, die um den Kern passt, und eine, die nicht passt.",
  schritte:[
   {titel:"Keine Bahn",dauer:7,text:"Ein Elektron ist auch eine Welle. Deshalb hat es im Atom keinen festen Weg wie ein Planet. Man kann nur angeben, wo man es mit welcher Wahrscheinlichkeit findet."},
   {titel:"Die Wolke",dauer:8,text:"Misst man den Ort des Elektrons immer wieder, ergibt jede Messung einen Punkt. Viele Punkte zusammen bilden eine Wolke. Den Bereich, in dem das Elektron zu 90 Prozent zu finden ist, nennt man Orbital."},
   {titel:"Verschiedene Formen",dauer:8,text:"Orbitale haben verschiedene Formen. Das einfachste ist eine Kugel und heißt s-Orbital. Das p-Orbital sieht aus wie eine Hantel, das d-Orbital oft wie ein Kleeblatt. Je höher die Energiestufe, desto mehr Formen gibt es."},
   {titel:"Die Welle muss passen",dauer:8,text:"Warum sind nur bestimmte Energien erlaubt? Die Welle des Elektrons muss um den Kern herum zu sich selbst passen, wie eine Saite, die zwischen zwei Enden schwingt. Passt sie nicht, löscht sie sich selbst aus. Jede passende Welle ist ein Orbital mit einer festen Energie."}
  ],
  merksatz:"Ein Orbital zeigt, wo sich ein Elektron wahrscheinlich aufhält, nicht, wie es fliegt.",
  boxen:{
   was:"Ein Orbital ist der Bereich um den Atomkern, in dem ein Elektron mit hoher Wahrscheinlichkeit zu finden ist. Es ersetzt die Kreisbahn aus Bohrs Modell.",
   so:"Stell dir viele Messungen des Ortes vor. Wo die Punkte dicht liegen, ist das Elektron oft. Die Form der Punktwolke ist die Form des Orbitals.",
   bedeutet:"Die Formen der Orbitale bestimmen, in welche Richtungen ein Atom Bindungen eingeht. Daraus ergibt sich zum Beispiel der Winkel im Wasser-Molekül.",
   tipp:"Die Bilder zeigen einen flachen Schnitt. In Wirklichkeit sind Orbitale räumlich: Das s-Orbital ist eine Kugel, vom p-Orbital gibt es drei, die in die drei Raumrichtungen zeigen."
  }},
 {nr:14,b:3,titel:"Spin und Pauli-Prinzip",zeichne:"spin",
  bild:"Zwei Elektronen mit Spin auf und Spin ab. Ein Strahl aus Silber-Atomen teilt sich im Magnetfeld in genau zwei Teile. Kästchen zeigen, was Pauli erlaubt und verbietet, und wie sich die Stufen mit zehn Elektronen füllen.",
  schritte:[
   {titel:"Der Spin",dauer:7,text:"Elektronen haben eine Eigenschaft, die es im Alltag nicht gibt: den Spin. Er macht das Elektron zu einer winzigen Magnetnadel. Misst man ihn, gibt es nur zwei Ergebnisse: Spin auf oder Spin ab."},
   {titel:"Der Beweis mit dem Magneten",dauer:8,text:"1922 schickten Otto Stern und Walther Gerlach in Frankfurt Silber-Atome durch ein besonderes Magnetfeld. Gewöhnliche kleine Magnete würden dabei einen breiten Streifen ergeben. Der Strahl teilte sich aber in genau zwei Teile. Dazwischen kam nichts an."},
   {titel:"Paulis Verbot",dauer:8,text:"1925 fand Wolfgang Pauli eine strenge Regel: Zwei Elektronen in einem Atom dürfen nie in allen Eigenschaften übereinstimmen. In ein Orbital passen deshalb höchstens zwei Elektronen, eines mit Spin auf und eines mit Spin ab."},
   {titel:"Die Stufen füllen sich",dauer:9,text:"Wegen Paulis Verbot können nicht alle Elektronen auf der untersten Stufe sitzen. Ist ein Orbital voll, muss das nächste Elektron auf eine höhere Stufe. So füllen sich die Stufen von unten nach oben. Im Bild siehst du die 10 Elektronen von Neon."}
  ],
  merksatz:"In ein Orbital passen höchstens zwei Elektronen: eines mit Spin auf, eines mit Spin ab.",
  boxen:{
   was:"Der Spin ist eine Quanteneigenschaft des Elektrons mit nur zwei möglichen Messwerten. Das Pauli-Prinzip sagt: Keine zwei Elektronen eines Atoms sind in allem gleich.",
   so:"Orbitale von unten nach oben füllen. In jedes Orbital zuerst ein Elektron mit Spin auf, dann eines mit Spin ab. Dann ist es voll.",
   bedeutet:"Ohne das Pauli-Prinzip säßen alle Elektronen ganz unten. Alle Atome wären sich ähnlich, und es gäbe keine Chemie, wie wir sie kennen.",
   tipp:"Der Name Spin kommt vom englischen Wort für Drehung. Das Elektron dreht sich aber nicht wirklich wie ein Kreisel. Der Spin ist eine eigene Eigenschaft, so wie die Ladung."
  }},
 {nr:15,b:3,titel:"Warum das Periodensystem so aussieht",zeichne:"perioden",
  bild:"Ein Atom mit drei Schalen. Die Schalen füllen sich von Wasserstoff bis Natrium. Lithium und Natrium im Vergleich, dann die ersten drei Zeilen des Periodensystems.",
  schritte:[
   {titel:"Schalen",dauer:7,text:"Energiestufen, die nah beieinander liegen, fasst man zu einer Schale zusammen. In die erste Schale passen 2 Elektronen, in die zweite 8. Bei den leichten Elementen ist auch die dritte Schale mit 8 Elektronen erst einmal voll."},
   {titel:"Auffüllen",dauer:9,text:"Wasserstoff hat 1 Elektron, Helium 2. Damit ist die erste Schale voll. Lithium muss mit seinem dritten Elektron eine neue Schale anfangen. Bei Neon mit 10 Elektronen ist auch die zweite Schale voll, und Natrium beginnt die dritte."},
   {titel:"Außen entscheidet",dauer:8,text:"Für die Chemie zählen vor allem die Elektronen in der äußersten Schale. Lithium und Natrium haben dort beide genau 1 Elektron. Deshalb verhalten sie sich ähnlich: Beide sind weiche Metalle, die heftig mit Wasser reagieren."},
   {titel:"Spalten und Zeilen",dauer:8,text:"Im Periodensystem stehen Elemente mit gleich vielen Außenelektronen untereinander. Ganz links stehen die mit 1 Außenelektron. Ganz rechts stehen die Edelgase mit voller Schale, sie reagieren fast gar nicht. Mit jeder neuen Zeile beginnt eine neue Schale."},
   {titel:"Quantenphysik erklärt die Chemie",dauer:7,text:"Das Periodensystem wurde 1869 aufgestellt, nur durch Vergleichen der Stoffe. Warum es so aussieht, weiß man erst seit der Quantenphysik: Energiestufen und Paulis Verbot ergeben die Schalen, und die Schalen ergeben das Periodensystem."}
  ],
  merksatz:"Die Zahl der Außenelektronen bestimmt, wie sich ein Element verhält.",
  boxen:{
   was:"Das Periodensystem ordnet alle Elemente nach der Zahl ihrer Protonen. Sein Aufbau aus Zeilen und Spalten folgt aus den Schalen, in denen die Elektronen sitzen.",
   so:"Elektronen von innen nach außen verteilen: 2 in die erste Schale, 8 in die zweite, dann weiter. Die Zahl in der äußersten Schale sagt dir die Spalte.",
   bedeutet:"Atome mit voller Außenschale sind zufrieden und reagieren kaum. Alle anderen geben Elektronen ab, nehmen welche auf oder teilen sie. So entstehen chemische Bindungen.",
   tipp:"Rechenaufgabe: Chlor hat 17 Elektronen. 2 + 8 = 10 sitzen innen, also bleiben 7 außen. Chlor fehlt genau 1 Elektron zur vollen Schale. Darum reagiert es so gern mit Natrium, das 1 übrig hat: Es entsteht Kochsalz."
  }},
 {nr:16,b:4,titel:"Heisenbergs Unschärfe",zeichne:"unschaerfe",
  bild:"Ein Auto mit genau bekanntem Ort und Tempo. Dann eine lange Welle und ein kurzes Wellenpaket im Vergleich, zwei Balken, von denen einer wächst, wenn der andere schrumpft, und ein Elektron in einem engen und einem weiten Kasten.",
  schritte:[

const wurzel=document.documentElement, vorgabe=wurzel.getAttribute("data-theme");

function setzeThema(t){
  thema=t; schreib("qs-thema",t);
  if(t==="dunkel")wurzel.setAttribute("data-theme","dark");
  else if(t==="hell")wurzel.setAttribute("data-theme","light");
  else if(vorgabe)wurzel.setAttribute("data-theme",vorgabe); else wurzel.removeAttribute("data-theme");
  document.querySelectorAll("[data-thema]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.thema===t));
  farbenLesen(); if(P)zeichne();
}

  const s=getComputedStyle(wurzel);

}
document.querySelectorAll("[data-thema]").forEach(b=>b.onclick=()=>setzeThema(b.dataset.thema));

    pille(x,180,24,"1926 · Max Born",akz,a); schrift(x,"?",180,66,akz,30,klemm(p*3-.6),700);
    pille(x,180,240,"Was schwingt bei einem Elektron?",C.text,klemm(p*3-1.2));
  }else if(s===1){const a=klemm(p*3), g=weich(klemm((p-.3)/.5));
    linie(x,L,80,R,80,C.linie,a,1,[2,5]); kurve(x,px=>80-32*psi(px-180),L,R,akz,a,2.2);
    pille(x,62,40,"WELLE",akz,a);
    pfeil(x,306,100,306,150,C.grau,klemm(p*3-.6)); schrift(x,"mal sich selbst",248,126,C.grau,10,klemm(p*3-.6));
    linie(x,L,212,R,212,C.grau,a,1); kurve(x,px=>212-66*g*Math.pow(psi(px-180),2),L,R,C.gold,klemm(p*3-.8),2.2,212);
    pille(x,180,246,"Welle zum Quadrat = Wahrscheinlichkeit",C.gold,klemm(p*3-1.8));
  }else if(s===2){const a=klemm(p*3-.5), b=klemm(p*3-1.5);
    linie(x,L,200,R,200,C.grau,1,1); kurve(x,px=>200-108*Math.pow(psi(px-180),2),L,R,C.gold,1,2.2,200);
    pille(x,180,46,"hoch: hier landen viele",C.gold,a); pfeil(x,180,60,180,84,C.gold,a);
    pfeil(x,195,226,195,206,C.grau,b); pille(x,195,240,"null: hier landet keines",C.grau,b);
  }else if(s===3){const n=Math.round(400*Math.pow(klemm(p/.85),1.6)), hoch=new Array(56).fill(0);
    linie(x,L,200,R,200,C.grau,1,1);
    x.save(); x.fillStyle=C.gold;
    for(let i=0;i<n;i++){const k=Math.floor((PROBEN[i]+140)/5); x.fillRect(L+k*5+.6,200-(hoch[k]+1)*3.6+.5,3.8,3.1); hoch[k]++}
    x.restore();
    kurve(x,px=>200-108*Math.pow(psi(px-180),2),L,R,C.grau,.8,1.4);
    pille(x,180,40,p<.55?"jeder Treffer: Zufall":"viele Treffer: die Kurve",p<.55?C.text:akz); pille(x,180,240,"Treffer: "+n,C.gold);
  }else{const a=klemm(p*3), b=klemm(p*3-.9), g=weich(klemm((p-.3)/.45)), wurf=p<.3?(Math.floor(t*7)*5)%6+1:4;
    x.save(); x.globalAlpha=a; x.fillStyle=C.flaeche2; x.strokeStyle=C.text; x.lineWidth=1.6; x.beginPath(); x.roundRect(48,88,60,60,10); x.fill(); x.stroke(); x.restore();
    AUGEN[wurf].forEach(([dx,dy])=>kugel(x,78+dx*17,118+dy*17,4.5,C.text,a));
    pille(x,78,172,"1 Wurf: Zufall",C.text,a);
    linie(x,160,150,324,150,C.grau,b,1);
    [162,171,158,175,166,168].forEach((w,k)=>{block(x,166+k*26,150-w/175*72*g,18,w/175*72*g,akz,b,3); schrift(x,String(k+1),175+k*26,161,C.grau,10,b)});
    pille(x,243,186,"1.000 Würfe: Regel",akz,b);
    pille(x,180,244,"Quantenzufall: nach heutigem Wissen echt",C.gold,klemm(p*3-2));
  }
 },
 doppelspalt(x,s,p,t,akz){
  const QX=34,QY=130,WX=141,SX=250,O=40,U=220,S1=118,S2=142,PL=266,PR=350;
  const a0=s===0?klemm(p*4):1, a1=s===0?klemm(p*4-.7):1, a2=s===0?klemm(p*4-1.4):1;

  // Wellen (nur Schritt 5), hinter allem anderen
  if(s===4){const a=klemm(p*2.5)*.5, lam=6.5, v=(t*9)%lam;
    x.save(); x.strokeStyle=akz; x.lineWidth=1.6; x.globalAlpha=a;
    x.save(); x.beginPath(); x.rect(QX+4,O,WX-3-QX-4,U-O); x.clip();
    for(let r=v;r<125;r+=lam){x.beginPath();x.arc(QX,QY,r,-1.2,1.2);x.stroke()}
    x.restore();
    x.save(); x.beginPath(); x.rect(WX+3,O,SX-WX-5,U-O); x.clip();
    [S1,S2].forEach(sy=>{for(let r=v;r<160;r+=lam){x.beginPath();x.arc(WX+3,sy,r,-1.5708,1.5708);x.stroke()}});
    x.restore(); x.restore();}

  // Quelle, Wand mit zwei Spalten, Schirm, Schirm von vorn
  block(x,12,118,24,24,C.grau,a0,5); block(x,32,126,6,8,C.gold,a0,2);
  x.save(); x.globalAlpha=a1; x.fillStyle=C.text; [[O,S1-4],[S1+4,S2-4],[S2+4,U]].forEach(([o,u])=>x.fillRect(WX-3,o,6,u-o)); x.restore();
  block(x,SX-1.5,O,3,U-O,C.text,a2,1);
  x.save(); x.globalAlpha=a2; x.fillStyle=C.bg; x.strokeStyle=C.linie; x.lineWidth=1; x.beginPath(); x.roundRect(PL,O,PR-PL,U-O,6); x.fill(); x.stroke(); x.restore();
  pille(x,36,238,"QUELLE",C.grau,a0); pille(x,WX,238,"DOPPELSPALT",C.grau,a1); pille(x,SX,238,"SCHIRM",C.grau,a2);
  schrift(x,"von vorn",316,238,C.grau,10,a2);

  // Erwartung: Kugeln auf geraden Bahnen, zwei Streifen
  if(s===1){const a=klemm(p*3), b=klemm(p*2.5-.8);
    [S1,S2].forEach(sy=>{const ye=QY+(sy-QY)*(SX-QX)/(WX-QX);
      block(x,PL+4,ye-8,PR-PL-8,16,C.gold,b*.5,4);
      for(let k=0;k<3;k++){const f=(t*.4+k/3)%1, bx=misch(40,SX-4,f); kugel(x,bx,QY+(sy-QY)*(bx-QX)/(WX-QX),3,C.gold,a)}});
    pille(x,180,18,"Erwartung bei kleinen Kugeln",C.text,a); pille(x,180,262,"zwei Streifen",C.gold,b);}

  // Treffer auf dem Schirm
  let n=0, blitz=0, f=0;
  if(s===0){n=p>.8?1:0; blitz=n?1-klemm((p-.8)/.15):0}
  else if(s===2){const m=p*25, idx=Math.min(24,Math.floor(m)); f=p>=1?1:m-idx; n=idx+(f>.6?1:0); blitz=f>.6?1-(f-.6)/.4:0;
    if(f<.6)kugel(x,misch(40,124,f/.6),QY,3,C.gold,1-f/.6);}
  else if(s===3)n=Math.round(25+1375*Math.pow(klemm(p/.8),2));
  else if(s===4)n=1400;
  if(n>0){const r=misch(1.9,1.1,klemm(n/300)); x.save(); x.fillStyle=C.gold;
    for(let i=0;i<n;i++){x.beginPath();x.arc(TREFFER[i][0],TREFFER[i][1],r,0,6.2832);x.fill()} x.restore();
    if(blitz>0){const q=TREFFER[n-1]; ring(x,SX,q[1],3+(1-blitz)*7,C.gold,blitz,1.5); ring(x,q[0],q[1],3+(1-blitz)*7,C.gold,blitz,1.5)}}

  // Beschriftungen je Schritt
  if(s===0)pille(x,180,262,"jeder Treffer = ein Punkt",C.gold,klemm((p-.8)*8));
  if(s===2){pille(x,180,18,"ein Elektron nach dem anderen",C.text,klemm(p*6)); pille(x,180,262,"Treffer: "+n,C.gold);}
  if(s===3){pille(x,180,18,p<.6?"immer mehr Elektronen":"viele Streifen = Interferenz",p<.6?C.text:akz); pille(x,180,262,"Treffer: "+zahl(n),C.gold);}
  if(s===4){pille(x,180,18,"die Welle geht durch beide Spalte",akz,klemm(p*4)); pille(x,180,262,"Wellen verstärken sich = viele Treffer",C.gold,klemm(p*4-1.6));}
 }
};
